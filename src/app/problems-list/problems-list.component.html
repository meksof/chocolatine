<div class="h-screen bg-cream-bg flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow-md px-16 py-4 flex items-center h-[90px]">
    <div class="flex items-center relative">
      <!-- Logo -->
      <div class="relative w-[69px] h-[90px]">
        <span class="absolute left-0 top-0 text-[88px] leading-none font-normal text-brown-primary font-italiana h-[90px]">C</span>
        <span class="absolute left-8 top-6 text-[37px] leading-none font-normal text-brown-primary font-italiana">Σ</span>
      </div>
    </div>
  </header>

  <!-- Content -->
  <main class="flex-1 p-16">
    <div class="bg-white rounded-lg shadow-md p-12">
      <!-- Page Header -->
      <div class="mb-6">
        <h1 class="text-4xl font-bold text-black tracking-wider mb-4">Problems</h1>
        <nav class="text-sm text-blue-action px-6 py-4">
          Problem List
        </nav>
      </div>

      <!-- Actions Bar -->
      <div class="flex justify-end mb-6">
        <button 
          (click)="onAddProblem()"
          class="bg-brown-primary text-white px-4 py-2 rounded text-sm font-medium tracking-widest uppercase hover:bg-[#7A4809] transition-colors">
          add problem
        </button>
      </div>

      <!-- Table -->
      <div class="bg-white rounded shadow-md overflow-hidden">
        <table class="w-full">
          <!-- Table Header -->
          <thead class="bg-brown-light">
            <tr>
              <th class="text-left py-3 px-4 text-brown-primary text-xs font-bold tracking-wider uppercase">Filename</th>
              <th class="text-left py-3 px-4 text-brown-primary text-xs font-bold tracking-wider uppercase">Date</th>
              <th class="text-left py-3 px-4 text-brown-primary text-xs font-bold tracking-wider uppercase">Format</th>
              <th class="text-left py-3 px-4 text-brown-primary text-xs font-bold tracking-wider uppercase">Actions</th>
            </tr>
          </thead>
          <!-- Table Body -->
          <tbody class="divide-y divide-gray-200">
            <tr *ngFor="let problem of problems" class="hover:bg-gray-50">
              <td class="py-3 px-4 text-sm text-black">{{ problem.filename }}</td>
              <td class="py-3 px-4 text-sm text-black">{{ problem.date }}</td>
              <td class="py-3 px-4 text-sm text-black">{{ problem.format }}</td>
              <td class="py-3 px-4">
                <div class="flex space-x-4 text-sm">
                  <button 
                    (click)="onResolve(problem)"
                    class="text-blue-action hover:underline">
                    Resolve
                  </button>
                  <button 
                    (click)="onConsult(problem)"
                    class="text-blue-action hover:underline">
                    Consult
                  </button>
                  <button 
                    (click)="onDownload(problem)"
                    class="text-blue-action hover:underline">
                    Download
                  </button>
                  <button 
                    (click)="onDelete(problem)"
                    class="text-red-delete hover:underline">
                    Delete
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Pagination Footer -->
        <div class="bg-white px-6 py-4 flex items-center justify-end space-x-8 border-t border-gray-200">
          <span class="text-xs text-black">Rows per page:</span>
          <div class="relative">
            <select class="text-xs text-black bg-transparent border-b border-gray-300 pr-6 pb-1 appearance-none">
              <option>5</option>
              <option>10</option>
              <option>25</option>
            </select>
            <span class="material-icons absolute right-0 top-0 text-gray-500 text-sm pointer-events-none">arrow_drop_down</span>
          </div>
          <span class="text-xs text-black">1-5 of 10</span>
          <div class="flex space-x-1">
            <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
              <span class="material-icons text-gray-300 text-lg">chevron_left</span>
            </button>
            <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-100">
              <span class="material-icons text-gray-600 text-lg">navigate_next</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
